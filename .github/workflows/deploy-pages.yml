name: Deploy client to GitHub Pages

# Publishes the built client to the gh-pages branch (classic Pages
# source). The branch route is used instead of actions/deploy-pages
# because creating the Pages site via the API requires repo-admin
# rights the default workflow token does not have; pushing gh-pages
# auto-enables Pages on public repos.
on:
  push:
    branches:
      - main
      # Prototype branch — remove once merged to main.
      - claude/blam-prd-build-spec-u5bcej
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Headless acceptance tests
        run: npm --workspace @schmalo/sim run test
      - name: Build client
        run: npm --workspace @schmalo/client-web run build
      - name: Push to gh-pages
        run: |
          cd apps/client-web/dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
